<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Flowise — Plan práctico (RAG + Agentes + Plantillas) — v2.1</title>
<style>
:root{
  --bg:#0b0f17; --panel:#0f1626; --card:#121c31; --muted:#9bb0d0;
  --text:#e8eefc; --line:#223253; --ok:#20c997; --warn:#ffb020; --bad:#ff5c7a;
  --accent:#6ea8fe; --accent2:#9d7bff;
  --shadow: 0 14px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,#070a11 0%,#0b0f17 60%,#070a11 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}

.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
.side{
  position:sticky; top:0; height:100vh;
  background:rgba(15,22,38,.78);
  backdrop-filter: blur(10px);
  border-right:1px solid var(--line);
  padding:18px 16px;
  overflow-y:auto; /* FIX: permite llegar al final del menú */
}
.main{padding:22px 22px 70px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(110,168,254,.25)}
h1{font-size:15px;margin:0}
.sub{color:var(--muted);margin:2px 0 0 0;font-size:12px}

.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);cursor:pointer;user-select:none;background:rgba(10,16,32,.65)}
.pill.active{border-color:rgba(110,168,254,.65);color:var(--text);background:rgba(110,168,254,.12)}

.search{margin:12px 0 10px}
.search input{width:100%;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);outline:none}
.search input:focus{border-color:rgba(110,168,254,.75);box-shadow:0 0 0 4px rgba(110,168,254,.12)}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.kpi .box{background:rgba(18,28,49,.7);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.kpi .num{font-size:18px;font-weight:700}
.kpi .lbl{color:var(--muted);font-size:12px;margin-top:2px}

.nav{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.nav a{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 10px;border-radius:12px;border:1px solid transparent;
  color:var(--text); background:transparent;
}
.nav a:hover{background:rgba(110,168,254,.08);border-color:rgba(110,168,254,.2)}
.nav a.active{background:rgba(110,168,254,.12);border-color:rgba(110,168,254,.45)}
.nav small{color:var(--muted)}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{background:rgba(110,168,254,.12);border:1px solid rgba(110,168,254,.45);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer}
button:hover{background:rgba(110,168,254,.18)}
button.secondary{background:rgba(18,28,49,.7);border-color:var(--line)}
button.danger{background:rgba(255,92,122,.12);border-color:rgba(255,92,122,.55)}

.card{background:rgba(18,28,49,.72);border:1px solid var(--line);border-radius:18px;padding:14px 14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 6px 0}
.card .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.outcomes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.outcomes span{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);background:rgba(10,16,32,.55)}

.step{padding:12px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(10,16,32,.55);margin:10px 0}
.stephead{display:flex;gap:10px;align-items:flex-start}
.chk{margin-top:3px}
.step h3{font-size:14px;margin:0}
.small{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.chip.ok{border-color:rgba(32,201,151,.55);color:#bff3e4}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent)}
ul{margin:8px 0 0 20px}
li{margin:4px 0}
.hr{height:1px;background:var(--line);margin:14px 0}

table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:rgba(10,16,32,.55);position:sticky;top:0}
tbody tr:hover{background:rgba(110,168,254,.05)}
tfoot td{color:var(--muted)}

.footer{margin-top:18px;color:var(--muted);font-size:12px}
.toplink{float:right;color:var(--muted)}

@media (max-width: 980px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>

    <div class="kpi">
      <div class="box">
        <div class="num" id="kpiDone">0</div>
        <div class="lbl">Pasos completados</div>
      </div>
      <div class="box">
        <div class="num" id="kpiTotal">0</div>
        <div class="lbl">Pasos totales</div>
      </div>
    </div>

    <div class="search">
      <input id="q" type="text" placeholder="Buscar pasos, tags, palabras... (ej: pgvector, cheerio, agentes)"/>
    </div>

    <div class="pillrow" id="tagPills"></div>

    <div class="toolbar">
      <button id="btnExport" title="Exporta tus checks + notas a un JSON">Exportar progreso</button>
      <button class="secondary" id="btnImport" title="Importa un JSON de progreso">Importar</button>
      <input id="importFile" type="file" accept="application/json" style="display:none"/>
      <button class="danger" id="btnReset" title="Borra progreso guardado en este navegador">Reset</button>
    </div>

    <div class="hr"></div>
    <div class="nav" id="nav"></div>

    <div class="footer">
      <div><b>Notas:</b> Progreso se guarda en tu navegador (localStorage). No se sube nada a internet.</div>
      <div style="margin-top:6px">Generado: <span id="genDate"></span></div>
    </div>
  </aside>

  <main class="main">
    <div id="content"></div>
  </main>
</div>

<script>
(() => {
  "use strict";

  // ========= Carga de datos (sin JSON inválido, sin comentarios) =========
  const DATA = JSON.parse(document.getElementById("DATA").textContent);

  // ========= Estado =========
  const LS_KEY = "flowise_plan_v21_progress";
  const LS_NOTES = "flowise_plan_v21_notes";
  let progress = {};
  let notes = {};
  let activeTag = "all";
  let query = "";

  // ========= Persistencia =========
  function loadState(){
    try{ progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }catch(e){ progress={}; }
    try{ notes = JSON.parse(localStorage.getItem(LS_NOTES) || "{}"); }catch(e){ notes={}; }
  }
  function saveState(){
    localStorage.setItem(LS_KEY, JSON.stringify(progress));
    localStorage.setItem(LS_NOTES, JSON.stringify(notes));
  }

  // ========= Util =========
  function esc(s){
    return (s||"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }
  function getAllSteps(){
    const all=[];
    DATA.sections.forEach(sec => sec.steps.forEach(st => all.push({secId:sec.id, secTitle:sec.title, ...st})));
    return all;
  }
  function matches(step){
    const hay = [
      step.secTitle, step.title, (step.tags||[]).join(" "),
      (step.why||""), (step.what||[]).join(" "),
      (step.dissect||[]).join(" "), (step.deliverables||[]).join(" "),
      (step.downloads||[]).join(" ")
    ].join(" ").toLowerCase();

    const qok = !query || hay.includes(query.toLowerCase());
    const tok = activeTag==="all" || (step.tags||[]).includes(activeTag);
    return qok && tok;
  }
  function doneCount(){
    const all = getAllSteps();
    return all.reduce((acc,s)=> acc + (progress[s.id] ? 1 : 0), 0);
  }
  function totalCount(){
    return getAllSteps().length;
  }
  function sectionCounts(){
    const map={};
    DATA.sections.forEach(sec => {
      let tot=0, done=0;
      sec.steps.forEach(st => {
        tot++;
        if(progress[st.id]) done++;
      });
      map[sec.id] = {tot, done};
    });
    return map;
  }

  // ========= Render pills =========
  function renderTagPills(){
    const tags = DATA.tags || [];
    const el = document.getElementById("tagPills");
    const pill = (id,label) => {
      const cls = (activeTag===id) ? "pill active" : "pill";
      return `<div class="${cls}" data-tag="${esc(id)}">${esc(label)}</div>`;
    };
    el.innerHTML = pill("all","Todo") + tags.map(t=>pill(t.id,t.label)).join("");
    el.querySelectorAll("[data-tag]").forEach(n => {
      n.addEventListener("click", () => {
        activeTag = n.getAttribute("data-tag");
        renderAll();
      });
    });
  }

  // ========= Render nav =========
  function renderNav(){
    const navEl = document.getElementById("nav");
    const counts = sectionCounts();
    navEl.innerHTML = DATA.sections.map(sec => {
      const c = counts[sec.id] || {tot:0, done:0};
      return `<a href="#sec-${esc(sec.id)}" data-sec="${esc(sec.id)}">
        <span>${esc(sec.title)}</span>
        <span class="badge">${c.done}/${c.tot}</span>
      </a>`;
    }).join("");

    // smooth scroll
    navEl.querySelectorAll("a[data-sec]").forEach(a => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const id = a.getAttribute("data-sec");
        const target = document.getElementById("sec-" + id);
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
        history.replaceState(null, "", "#sec-" + id);
      });
    });
  }

  // ========= Render content =========
  function renderContent(){
    const content = document.getElementById("content");

    const used = DATA.resources_used || [];
    const unused = DATA.resources_unused || [];

    const usedTable = () => {
      const rows = used.map(r => `
        <tr>
          <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a><div class="small">${esc(r.url)}</div></td>
          <td class="small">${esc(r.type||"")}</td>
        </tr>
      `).join("");
      return `
        <details open>
          <summary>Recursos usados (informe + base) — ${used.length}</summary>
          <table>
            <thead><tr><th>Recurso</th><th>Etiqueta</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </details>
      `;
    };

    const unusedTable = () => {
      const rows = unused.map(r => `
        <tr>
          <td><div><b>${esc(r.title)}</b></div><div class="small">${esc(r.domain)}</div></td>
          <td><a href="${esc(r.search)}" target="_blank" rel="noopener">Buscar / abrir</a></td>
        </tr>
      `).join("");
      return `
        <details>
          <summary>Fuentes no usadas (registradas) — ${unused.length}</summary>
          <div class="small" style="margin-top:8px">
            Estas fuentes se registran aunque no se usen todavía. Úsalas para crear ejercicios nuevos o mejorar los existentes.
          </div>
          <table>
            <thead><tr><th>Fuente</th><th>Acción</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </details>
      `;
    };

    const stepHtml = (sec, st) => {
      const checked = !!progress[st.id];
      const chips = (st.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("");
      const mins = st.minutes ? `<span class="chip ok">⏱ ${st.minutes}m</span>` : "";
      const why = st.why ? `<div class="small" style="margin-top:6px">${esc(st.why)}</div>` : "";

      const list = (arr) => arr && arr.length ? `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="small">—</div>`;
      const refs = (st.refs||[]).length ? `<ul>${st.refs.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a> <span class="small">(${
        esc(r.type||"ref")
      })</span></li>`).join("")}</ul>` : `<div class="small">—</div>`;

      const noteKey = st.id;
      const noteVal = notes[noteKey] || "";

      return `
        <div class="step" data-step="${esc(st.id)}" data-tags="${esc((st.tags||[]).join(" "))}">
          <div class="stephead">
            <div class="chk">
              <input type="checkbox" data-check="${esc(st.id)}" ${checked ? "checked" : ""}/>
            </div>
            <div style="flex:1">
              <h3>${esc(st.title)}</h3>
              <div class="chips">${mins}${chips}</div>
              ${why}
              <details>
                <summary>Ver receta, entregables, disectar y referencias</summary>
                <div class="hr"></div>

                <div><b>Qué harás</b></div>
                ${list(st.what)}

                <div class="hr"></div>
                <div><b>Entregables</b></div>
                ${list(st.deliverables)}

                <div class="hr"></div>
                <div><b>Qué disectar (analizar)</b></div>
                ${list(st.dissect)}

                <div class="hr"></div>
                <div><b>Qué descargar / recolectar</b></div>
                ${list(st.downloads)}

                <div class="hr"></div>
                <div><b>Referencias (link directo)</b></div>
                ${refs}

                <div class="hr"></div>
                <div><b>Notas tuyas</b> <span class="small">(se guardan en tu navegador)</span></div>
                <textarea data-note="${esc(noteKey)}" rows="3" style="width:100%;margin-top:6px;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text);outline:none">${esc(noteVal)}</textarea>
              </details>
            </div>
          </div>
        </div>
      `;
    };

    const sectionHtml = (sec) => {
      // filtro por query/tag: si no hay steps visibles, oculta sección (salvo biblioteca y fuentes)
      const visible = sec.steps.filter(st => matches({secTitle:sec.title, ...st}));
      const isAppendix = (sec.id==="biblioteca" || sec.id==="fuentes_no_usadas");
      if(!isAppendix && visible.length===0) return "";

      const counts = sectionCounts()[sec.id] || {tot:sec.steps.length, done:0};
      const outcomes = (sec.outcomes||[]).map(o=>`<span>${esc(o)}</span>`).join("");

      const primaryRefs = (sec.primary_refs||[]).length
        ? `<details><summary>Referencias clave de esta sección</summary><ul>${sec.primary_refs.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a></li>`).join("")}</ul></details>`
        : "";

      let extra = "";
      if(sec.id==="biblioteca") {
        extra = usedTable();
      } else if(sec.id==="fuentes_no_usadas") {
        extra = unusedTable();
      }

      return `
        <section id="sec-${esc(sec.id)}" class="card">
          <a class="toplink" href="#top" data-top>↑ arriba</a>
          <h2>${esc(sec.title)} <span class="badge">${counts.done}/${counts.tot}</span></h2>
          <div class="meta">${esc(sec.subtitle||"")}</div>
          <div class="outcomes">${outcomes}</div>
          ${primaryRefs}
          <div class="hr"></div>
          <div>
            ${visible.map(st => stepHtml(sec, st)).join("")}
          </div>
          ${extra ? `<div class="hr"></div>${extra}` : ""}
        </section>
      `;
    };

    content.innerHTML = `<div id="top"></div>` + DATA.sections.map(sectionHtml).join("");
  }

  // ========= Eventos =========
  function bindEvents(){
    // checks
    document.querySelectorAll('input[data-check]').forEach(chk => {
      chk.addEventListener("change", () => {
        const id = chk.getAttribute("data-check");
        progress[id] = chk.checked;
        saveState();
        renderKpisAndNavOnly();
      });
    });
    // notes
    document.querySelectorAll('textarea[data-note]').forEach(t => {
      t.addEventListener("input", () => {
        const id = t.getAttribute("data-note");
        notes[id] = t.value;
        saveState();
      });
    });
    // top links
    document.querySelectorAll('a[data-top]').forEach(a => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        document.getElementById("top").scrollIntoView({behavior:"smooth", block:"start"});
        history.replaceState(null,"","#top");
      });
    });
  }

  function renderKpisAndNavOnly(){
    document.getElementById("kpiDone").textContent = doneCount();
    document.getElementById("kpiTotal").textContent = totalCount();
    renderNav();
    setupScrollSpy();
  }

  function setupScrollSpy(){
    const navEl = document.getElementById("nav");
    const links = Array.from(navEl.querySelectorAll("a[data-sec]"));
    links.forEach(l => l.classList.remove("active"));

    const sections = DATA.sections
      .map(s => document.getElementById("sec-" + s.id))
      .filter(Boolean);

    // limpia observer viejo
    if(window.__spy) {
      try { window.__spy.disconnect(); } catch(e){}
    }
    window.__spy = new IntersectionObserver((entries) => {
      // elige el más visible
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if(!visible) return;
      const id = visible.target.id.replace("sec-","");
      links.forEach(l => l.classList.toggle("active", l.getAttribute("data-sec")===id));
    }, {
      root:null,
      threshold:[0.15,0.25,0.4,0.55,0.7]
    });

    sections.forEach(s => window.__spy.observe(s));
  }

  function renderHeader(){
    document.getElementById("title").textContent = DATA.meta.title;
    document.getElementById("subtitle").textContent = DATA.meta.notes || "";
    document.getElementById("genDate").textContent = DATA.meta.generated || "";
  }

  function renderAll(){
    renderHeader();
    renderTagPills();
    renderContent();
    bindEvents();
    renderKpisAndNavOnly();
  }

  // search
  document.getElementById("q").addEventListener("input", (e) => {
    query = e.target.value.trim();
    renderAll();
  });

  // export/import/reset
  document.getElementById("btnExport").addEventListener("click", () => {
    const payload = {
      meta: DATA.meta,
      exportedAt: new Date().toISOString(),
      progress, notes
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "flowise_plan_progress.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  });
  document.getElementById("btnImport").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    try {
      const txt = await f.text();
      const obj = JSON.parse(txt);
      progress = obj.progress || {};
      notes = obj.notes || {};
      saveState();
      renderAll();
    } catch(err) {
      alert("No pude importar: JSON inválido.");
    } finally {
      e.target.value = "";
    }
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    if(!confirm("¿Borrar progreso y notas guardadas en este navegador?")) return;
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_NOTES);
    progress = {};
    notes = {};
    renderAll();
  });

  // ========= INIT =========
  loadState();
  renderAll();
})();
</script>
</body>
</html>
