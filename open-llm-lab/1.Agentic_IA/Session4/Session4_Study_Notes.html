         1. Dashboard Layout with a fixed/sticky header and navigation tabs.

            - Inicio: Overview and Goal.
            - Fundamentos: Interactive diagrams for Architecture.
            - Ruta de Aprendizaje: Timeline + Chart.js for effort distribution.
            - Biblioteca de Recursos: The core list, sortable/filterable (JS).
            - LangSmith: Dedicated section for observability.
         3. Rationale: Users learn differently. Some want the "best link" immediately (Library), others want to understand "what is a Chain" (Fundamentos). The structure separates theory from resource consumption.
    -->

         - Learning Path: Doughnut Chart to visualize the balance of "Theory vs Practice" and "Topic Weight".
         - Architecture: Interactive Grid (HTML/JS) instead of SVG to allow deep-diving into text descriptions on click.
         - Resource List: Cards with badges (ES/EN, Video/Doc) and a "Recomendado" highlight for the "Complete" sources requested.

                <p class="text-slate-700 text-sm mb-3">

                </p>

    <!-- VIEW: RUTA -->
    <template id="tmpl-roadmap">
        <div class="fade-in grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Ruta de Aprendizaje Sugerida</h2>
                <div class="relative border-l-4 border-indigo-200 ml-4 space-y-8 pl-8 py-2">
                    <!-- Step 1 -->
                    <div class="relative">
                        <span class="absolute -left-11 top-1 flex items-center justify-center w-6 h-6 bg-indigo-600 rounded-full text-white text-xs font-bold">1</span>
                        <h3 class="font-bold text-slate-800 text-lg">Bases y Prompt Engineering</h3>
                        <p class="text-sm text-slate-600 mb-2">No empieces con código. Empieza entendiendo cómo "hablarle" al modelo. Entiende la diferencia entre <code>SystemMessage</code>, <code>HumanMessage</code> y <code>AIMessage</code>.</p>
                        <div class="text-xs font-semibold text-indigo-600 bg-indigo-50 inline-block px-2 py-1 rounded">Enfoque: 20% Teoría, 80% Práctica</div>
                    </div>
                    <!-- Step 2 -->
                    <div class="relative">
                        <span class="absolute -left-11 top-1 flex items-center justify-center w-6 h-6 bg-indigo-600 rounded-full text-white text-xs font-bold">2</span>
                        <h3 class="font-bold text-slate-800 text-lg">RAG (Retrieval Augmented Generation)</h3>
                        <p class="text-sm text-slate-600 mb-2">El caso de uso #1. Aprende a cargar PDFs, dividirlos (chunking), vectorizarlos (embeddings) y guardarlos (VectorStore). Conecta esto al LLM.</p>
                        <div class="text-xs font-semibold text-indigo-600 bg-indigo-50 inline-block px-2 py-1 rounded">Proyecto: Chat con tu PDF</div>
                    </div>
                    <!-- Step 3 -->
                    <div class="relative">
                        <span class="absolute -left-11 top-1 flex items-center justify-center w-6 h-6 bg-indigo-600 rounded-full text-white text-xs font-bold">3</span>
                        <h3 class="font-bold text-slate-800 text-lg">LCEL & Cadenas</h3>
                        <p class="text-sm text-slate-600 mb-2">Domina la sintaxis de tuberías (<code>|</code>). Aprende a pasar datos de un paso a otro de forma limpia y tipada.</p>
                    </div>
                    <!-- Step 4 -->
                    <div class="relative">
                        <span class="absolute -left-11 top-1 flex items-center justify-center w-6 h-6 bg-indigo-600 rounded-full text-white text-xs font-bold">4</span>
                        <h3 class="font-bold text-slate-800 text-lg">LangSmith (Observabilidad)</h3>
                        <p class="text-sm text-slate-600 mb-2">Antes de crear Agentes complejos, necesitas ver qué está fallando. Configura Tracing y empieza a evaluar tus prompts.</p>
                    </div>
                    <!-- Step 5 -->
                    <div class="relative">
                        <span class="absolute -left-11 top-1 flex items-center justify-center w-6 h-6 bg-indigo-600 rounded-full text-white text-xs font-bold">5</span>
                        <h3 class="font-bold text-slate-800 text-lg">Agentes & LangGraph</h3>
                        <p class="text-sm text-slate-600 mb-2">El nivel avanzado. Construye flujos cíclicos donde el LLM decide el camino. LangGraph es la nueva forma de orquestar agentes multi-actor.</p>
                    </div>
                </div>
            </div>

                    <p class="text-xs text-blue-700">
                        No intentes aprender todo a la vez. Enfócate en dominar <strong>RAG</strong> primero. Es el 80% del valor comercial actual. Los Agentes son divertidos pero difíciles de estabilizar en producción sin bases sólidas.
                    </p>
                </div>
            </div>
        </div>
    </template>

    <!-- VIEW: LANGSMITH -->

                        <h2 class="text-3xl font-bold mb-4">LangSmith</h2>

                    <p class="text-slate-600 mb-4">
                        Visualiza cada paso de tu cadena. ¿Cuánto tardó el vector store? ¿Qué contexto exacto se le pasó al LLM? ¿Cuánto costó la llamada?
                    </p>
                    <div class="bg-slate-50 p-3 rounded border border-slate-200 text-xs font-mono text-slate-600">

                    <p class="text-slate-600 mb-4">

                </div>
            </div>
        </div>

                link: "https://www.youtube.com/results?search_query=langchain+tutorial+espa%C3%B1ol"
            },
            // GENERAL
            {
                id: 5,
                title: "LangSmith Walkthrough",
                author: "LangChain",
                type: "video",
                lang: "en",
                tier: "silver",
                desc: "Demo completa de cómo usar LangSmith para debugear.",
                link: "https://docs.smith.langchain.com/"
            },
            {
                id: 6,
                title: "Generative AI with LangChain",
                author: "Ben Auffarth (Libro)",
                type: "doc",
                lang: "en",
                tier: "silver",
                desc: "Libro completo sobre patrones de arquitectura modernos.",
                link: "#"
            },
            {
                id: 7,
                title: "Tutorial RAG desde Cero",
                author: "Alejandro AO - Software & AI",
                type: "video",
                lang: "es",
                tier: "silver",
                desc: "Excelente canal en español. Explicaciones muy claras sobre vectores y RAG.",
                link: "https://www.youtube.com/@AlejandroAO"
            },
            {
                id: 8,
                title: "LangGraph: Multi-Agent Workflows",
                author: "DeepLearning.AI",
                type: "course",
                lang: "en",
                tier: "silver",
                desc: "Curso avanzado para cuando domines lo básico. Construcción de agentes cíclicos.",
                link: "https://www.deeplearning.ai/short-courses/"
            },
            {
                id: 9,
                title: "Data Independent (Greg Kamradt)",
                author: "Greg Kamradt",
                type: "video",
                lang: "en",
                tier: "silver",
                desc: "Videos muy visuales y prácticos sobre cómo funciona el 'chunking' y los embeddings.",
                link: "https://www.youtube.com/@DataIndependent"
            },
             {
                id: 10,
                title: "Aprende IA con Python",
                author: "MoureDev / Otros",
                type: "video",
                lang: "es",
                tier: "silver",
                desc: "Videos introductorios para entender el ecosistema de IA en español.",
                link: "https://www.youtube.com/results?search_query=langchain+mouredev"
            }
        ];

        const detailsContent = {
            'modelio': {
                title: "Model I/O (Entrada/Salida)",
                html: "<p class='mb-2'>Es la capa base. No hablas con el modelo directamente, usas abstracciones:</p><ul class='list-disc pl-5 text-sm space-y-1'><li><strong>Prompts Templates:</strong> Plantillas dinámicas donde inyectas variables (ej. {pregunta}).</li><li><strong>LLMs vs ChatModels:</strong> Diferencia clave. LLMs completan texto, ChatModels usan mensajes (System, Human, AI).</li><li><strong>Output Parsers:</strong> Transforman la respuesta de texto del IA en JSON, listas o fechas usables por tu código.</li></ul>"
            },
            'retrieval': {
                title: "Retrieval & RAG",
                html: "<p class='mb-2'>Permite que el LLM sepa cosas que no estaban en su entrenamiento (tus datos).</p><ol class='list-decimal pl-5 text-sm space-y-1'><li><strong>Loaders:</strong> Leen PDF, HTML, CSV.</li><li><strong>Splitters:</strong> Rompen el texto en trozos pequeños.</li><li><strong>Embeddings:</strong> Convierten texto a vectores numéricos.</li><li><strong>Vector Store:</strong> Base de datos para buscar vectores por similitud (Pinecone, Chroma, FAISS).</li></ol>"
            },
            'chains': {
                title: "Chains (Cadenas)",
                html: "<p class='mb-2'>El pegamento. Una cadena une componentes. La más básica: <code>Prompt + Modelo + Parser</code>.</p><p class='text-sm'>Hoy en día se usa <strong>LCEL</strong> (LangChain Expression Language) para definirlas. Permiten crear flujos complejos como 'Busca en Google -> Resume -> Traduce'.</p>"
            },
            'memory': {
                title: "Memory (Memoria)",
                html: "<p class='mb-2'>Los LLMs son 'stateless' (no recuerdan el pasado). El componente de Memoria se encarga de:</p><ul class='list-disc pl-5 text-sm space-y-1'><li>Guardar el historial de chat.</li><li>Recortar mensajes antiguos si se excede el límite de tokens.</li><li>Inyectar el resumen de la conversación en el nuevo prompt.</li></ul>"
            },
            'agents': {
                title: "Agents (Agentes)",
                html: "<p class='mb-2'>Aquí el LLM actúa como motor de razonamiento. No sigue un camino fijo.</p><p class='text-sm'>Tú le das <strong>Herramientas</strong> (Calculadora, Buscador Web, API acceso). El Agente decide:</p><code class='text-xs bg-slate-200 p-1 block mt-1'>Pregunta -> ¿Necesito herramienta? -> Sí (Usa Calc) -> Observa resultado -> Responde final.</code>"
            },
            'langsmith': {
                title: "LangSmith (Observabilidad)",
                html: "<p class='mb-2'>Plataforma SaaS integrada.</p><ul class='list-disc pl-5 text-sm space-y-1'><li><strong>Debug:</strong> Haz clic en una ejecución fallida y ve exactamente qué prompt recibió el modelo.</li><li><strong>Dataset:</strong> Sube 100 preguntas de prueba.</li><li><strong>Evaluation:</strong> Ejecuta tu nuevo prompt contra las 100 preguntas y mide si la calidad mejoró o empeoró.</li></ul>"
            }
        };

        // --- APP LOGIC ---
        const app = {
            currentTab: 'home',
            
            init: function() {
                this.renderTabs();
                this.switchTab('home');
            },

            renderTabs: function() {
                const tabs = [
                    { id: 'home', label: 'Inicio', icon: 'fa-house' },
                    { id: 'roadmap', label: 'Ruta de Aprendizaje', icon: 'fa-road' },
                    { id: 'foundations', label: 'Fundamentos', icon: 'fa-shapes' },
                    { id: 'langsmith', label: 'LangSmith', icon: 'fa-magnifying-glass-chart' },
                    { id: 'library', label: 'Biblioteca', icon: 'fa-book' }
                ];
                
                const container = document.getElementById('tab-container');
                container.innerHTML = tabs.map(tab => `
                    <button 
                        onclick="app.switchTab('${tab.id}')"
                        class="tab-btn whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors ${this.currentTab === tab.id ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}"
                        id="tab-${tab.id}"
                    >
                        <i class="fa-solid ${tab.icon} mr-2"></i>${tab.label}
                    </button>
                `).join('');

                // Mobile nav sync
                const desktopNav = document.getElementById('desktop-nav');
                desktopNav.innerHTML = tabs.map(tab => `
                    <button onclick="app.switchTab('${tab.id}')" class="p-2 text-slate-500 hover:text-indigo-600" title="${tab.label}">
                        <i class="fa-solid ${tab.icon}"></i>
                    </button>
                `).join('');
            },

            switchTab: function(tabId) {
                this.currentTab = tabId;
                
                // Update UI Tabs
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    if(btn.id === `tab-${tabId}`) {
                        btn.classList.add('border-indigo-500', 'text-indigo-600');
                        btn.classList.remove('border-transparent', 'text-slate-500');
                    } else {
                        btn.classList.remove('border-indigo-500', 'text-indigo-600');
                        btn.classList.add('border-transparent', 'text-slate-500');
                    }
                });

                // Inject Content
                const template = document.getElementById(`tmpl-${tabId}`);
                const contentArea = document.getElementById('content-area');
                contentArea.innerHTML = "";
                contentArea.appendChild(document.importNode(template.content, true));

                // Post-render actions
                if (tabId === 'roadmap') this.initChart();
                if (tabId === 'library') this.renderLibrary();
                
                window.scrollTo(0,0);
            },

            showDetail: function(key) {
                const data = detailsContent[key];
                const panel = document.getElementById('arch-detail');
                
                // Simple fade effect
                panel.style.opacity = 0;
                setTimeout(() => {
                    panel.innerHTML = `
                        <div class="h-full flex flex-col">
                            <h3 class="text-xl font-bold text-indigo-700 mb-3">${data.title}</h3>
                            <div class="text-slate-700 flex-grow">${data.html}</div>
                            <div class="mt-4 pt-4 border-t border-slate-200">
                                <span class="text-xs font-semibold text-slate-400 uppercase">Estado: Fundamental</span>
                            </div>
                        </div>
                    `;
                    panel.style.opacity = 1;
                }, 200);
            },

            initChart: function() {
                const ctx = document.getElementById('effortChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Fundamentos/LCEL', 'RAG (Retrieval)', 'Agents', 'Evaluación/LangSmith'],
                        datasets: [{
                            data: [30, 40, 15, 15], // 40% on RAG is crucial
                            backgroundColor: [
                                '#6366f1', // Indigo
                                '#22c55e', // Green
                                '#a855f7', // Purple
                                '#f97316'  // Orange
                            ],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { font: { family: 'Inter', size: 11 } }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return context.label + ': ' + context.raw + '% Tiempo';
                                    }
                                }
                            }
                        }
                    }
                });
            },

            renderLibrary: function() {
                const langFilter = document.getElementById('langFilter').value;
                const typeFilter = document.getElementById('typeFilter').value;

                const filtered = resources.filter(r => {
                    const matchLang = langFilter === 'all' || r.lang === langFilter;
                    const matchType = typeFilter === 'all' || r.type === typeFilter;
                    return matchLang && matchType;
                });

                const highlights = filtered.filter(r => r.tier === 'gold');
                const others = filtered.filter(r => r.tier !== 'gold');

                const renderCard = (r, isGold) => `
                    <div class="bg-white p-5 rounded-lg border ${isGold ? 'border-indigo-200 shadow-md' : 'border-slate-200'} card-hover flex flex-col h-full">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold px-2 py-1 rounded ${r.lang === 'es' ? 'bg-yellow-100 text-yellow-800' : 'bg-slate-100 text-slate-600'}">
                                ${r.lang === 'es' ? 'ES' : 'EN'}
                            </span>
                            <span class="text-xs uppercase font-semibold text-slate-400">
                                <i class="fa-solid ${r.type === 'video' ? 'fa-video' : r.type === 'course' ? 'fa-graduation-cap' : 'fa-file-lines'}"></i> ${r.type}
                            </span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-lg mb-1 leading-tight">${r.title}</h4>
                        <p class="text-xs text-indigo-600 font-medium mb-3">${r.author}</p>
                        <p class="text-sm text-slate-600 mb-4 flex-grow">${r.desc}</p>
                        <a href="${r.link}" target="_blank" class="text-center w-full block py-2 rounded font-semibold text-sm transition-colors ${isGold ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'}">
                            Ir al Recurso <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs"></i>
                        </a>
                    </div>
                `;

                document.getElementById('highlights-list').innerHTML = highlights.length 
                    ? highlights.map(r => renderCard(r, true)).join('') 
                    : '<p class="text-sm text-slate-500 italic p-4">No hay recursos destacados con estos filtros.</p>';
                
                document.getElementById('general-list').innerHTML = others.length
                    ? others.map(r => renderCard(r, false)).join('')
                    : '<p class="text-sm text-slate-500 italic p-4">No hay recursos adicionales con estos filtros.</p>';
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
