<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Session6 MCP Trading Desk</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel form-panel">
        <h1>Session6 MCP Trading Desk</h1>
        <p>Envia una evaluacion para GOLD-T (M1).</p>
        <label>Notas
          <textarea id="notes" rows="4" placeholder="Observaciones opcionales..."></textarea>
        </label>
        <button id="run">Evaluar</button>
      </section>
      <section class="panel result-panel">
        <h2>Resultado</h2>
        <pre id="result">(sin ejecutar)</pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
